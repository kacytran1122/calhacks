name: S'mile CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject internal agent notes
        shell: bash
        run: |
          if find . -path ./.git -prune -o -type f \( -iname 'AGENT.md' -o -iname 'AGENTS.md' -o -iname 'AGENT_HANDOFF.md' -o -iname '*agent*communication*.md' -o -iname '*handoff*.md' \) -print -quit | grep -q .; then
            echo "Internal agent notes must not be committed."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --test tests/system/structure.test.mjs

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run typecheck --prefix backend
      - run: npm run test:backend --prefix backend

  agents:
    name: Agent controls and evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run test:agents --prefix backend
      - run: npm run eval --prefix backend

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            tests/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm ci --prefix tests
      - run: npm run typecheck --prefix frontend
      - run: npm test --prefix frontend
      - name: Photon bridge and persistent direct chat
        run: TSX_TSCONFIG_PATH=frontend/tsconfig.json node --conditions=react-server --import ./backend/node_modules/tsx/dist/loader.mjs --test tests/system/photon-bridge.test.ts
      - name: Photon dedicated-line QR and map handoff
        run: TSX_TSCONFIG_PATH=frontend/tsconfig.json node --conditions=react-server --import ./backend/node_modules/tsx/dist/loader.mjs --test tests/system/photon-join.test.ts
      - name: Venue photo upload integration
        run: TSX_TSCONFIG_PATH=frontend/tsconfig.json node --conditions=react-server --import ./backend/node_modules/tsx/dist/loader.mjs --test tests/system/tour-contributions.test.ts
      - name: Per-ride payments and final trip demo receipts
        run: TSX_TSCONFIG_PATH=frontend/tsconfig.json node --conditions=react-server --import ./backend/node_modules/tsx/dist/loader.mjs --test tests/system/ride-payments.test.ts
      - run: npm run extension:build --prefix frontend
      - run: npm run build --prefix frontend

  system:
    name: Whole-system tests
    needs: [backend, frontend, agents]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - name: Run web app and system checks
        shell: bash
        run: |
          npm run seed --prefix backend
          npm run dev --prefix frontend > /tmp/smile-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          node --input-type=module - <<'NODE'
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch('http://127.0.0.1:3000');
              if (response.ok) process.exit(0);
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
          process.exit(1);
          NODE
          npm run test:system --prefix backend

  delivery:
    name: Build delivery artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [structure, backend, frontend, agents, system]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run extension:build --prefix frontend
      - uses: actions/upload-artifact@v4
        with:
          name: smile-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            frontend/.next
            frontend/public/3d-tour
            frontend/public/map-assets
            frontend/extension/dist
            backend/src
            backend/hyphenate
            backend/visa
            backend/photon
            backend/scripts
            backend/ml/models
            backend/package.json
            backend/package-lock.json
